[platformio]
default_envs = ErsaWearable
core_dir = .pio-core

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

[env:ErsaWearable]
board = seeed_xiao_esp32c3
framework = arduino, espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 1
monitor_rts = 0

board_build.partitions = ota_ab.csv

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I src

; Exact versions keep the initial hardware baseline reproducible.
lib_deps =
    adafruit/Adafruit GFX Library@1.12.6
    mathertel/OneButton@2.6.2

; The SSD1681 backend uses ESP-IDF SPI directly. Adafruit GFX remains the
; renderer for the generic IDisplay canvas and MiSans font assets.

; Same Terra product composition on the XIAO ESP32-C6 silicon platform.
; The C6 has its own sdkconfig and BSP pin map so chip differences stay below
; the Board/HAL contracts.
[env:ErsaWearableC6]
extends = env:ErsaWearable
board = seeed_xiao_esp32c6

; Opt-in firmware tracing for BLE protocol and power-state investigations.
[env:ErsaWearableVerbose]
extends = env:ErsaWearable
build_flags = ${env:ErsaWearable.build_flags} -DERSA_VERBOSE_DIAGNOSTICS=1

[env:ErsaWearableC6Verbose]
extends = env:ErsaWearableC6
build_flags = ${env:ErsaWearable.build_flags} -DERSA_VERBOSE_DIAGNOSTICS=1
