[platformio]
default_envs = ErsaWearable
core_dir = .pio-core

[env:ErsaWearable]
platform = espressif32@6.12.0
board = seeed_xiao_esp32c3
framework = arduino, espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
monitor_dtr = 1
monitor_rts = 0

board_build.partitions = ota_ab.csv

build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I src

; Exact versions keep the initial hardware baseline reproducible.
lib_deps =
    zinggjm/GxEPD2@1.6.9
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/RTClib@2.1.4
    mathertel/OneButton@2.6.2

; The ESP-IDF component build selects only the panel configured by Kconfig.
lib_ignore = GxEPD2
