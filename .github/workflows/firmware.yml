name: Firmware

on:
  push:
    branches: [master]
    tags: ["ewp-*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build wiki and Doxygen API reference
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs
        run: python -m pip install -r requirements-docs.txt
      - name: Install Doxygen
        run: sudo apt-get update
      - name: Install Doxygen package
        run: sudo apt-get install --yes doxygen
      - name: Build wiki and API reference
        run: make docs
      - name: Upload wiki site
        uses: actions/upload-artifact@v4
        with:
          name: ewp-wiki-${{ github.sha }}
          path: .pio/wiki-site
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build ESP32-C3 firmware
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_CORE_DIR: ${{ github.workspace }}/.pio-core
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/firmware.yml

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            .pio-core
            .pio/libdeps
          key: ${{ runner.os }}-platformio-6.2-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-6.2-

      - name: Install PlatformIO
        run: python -m pip install platformio==6.2.0

      - name: Compile firmware
        run: pio run --environment ErsaWearable

      - name: Package firmware images
        run: python scripts/package_firmware.py

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ewp-firmware-${{ github.sha }}
          path: .pio/release/*
          if-no-files-found: error
          retention-days: 30

  package-ewctl:
    name: Build Arch Linux ewctl package and repository index
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/ewp-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build package in Arch Linux
        run: ./scripts/package_ewctl_arch.sh
      - name: Upload package repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: ewctl-arch-repo-${{ github.sha }}
          path: |
            .pio/release/ewctl-*.pkg.tar.zst
            .pio/release/ersa-ewctl.db
            .pio/release/ersa-ewctl.files
          if-no-files-found: error
          retention-days: 30

  publish-package-repository:
    name: Publish package repository and wiki to gh-pages
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/ewp-')
    needs: [build, package-ewctl, docs]
    runs-on: ubuntu-latest
    concurrency:
      group: ewctl-package-repository
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download package repository artifact
        uses: actions/download-artifact@v4
        with:
          name: ewctl-arch-repo-${{ github.sha }}
          path: .pio/release
      - name: Download wiki artifact
        uses: actions/download-artifact@v4
        with:
          name: ewp-wiki-${{ github.sha }}
          path: .pio/wiki-site
      - name: Download firmware artifact for OTA manifest
        if: startsWith(github.ref, 'refs/tags/ewp-')
        uses: actions/download-artifact@v4
        with:
          name: ewp-firmware-${{ github.sha }}
          path: .pio/release
      - name: Create OTA release manifest
        if: startsWith(github.ref, 'refs/tags/ewp-')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/create_ota_manifest.py .pio/release/firmware.bin --tag "$RELEASE_TAG" --site-root .pio/site
      - name: Assemble package, OTA, and wiki sites
        run: |
          mkdir -p .pio/site
          cp packaging/pages/index.html packaging/pages/CNAME .pio/site/
          cp .pio/release/ewctl-*.pkg.tar.zst .pio/release/ersa-ewctl.db .pio/release/ersa-ewctl.files .pio/site/
      - name: Publish static repository branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          SITE_REPO="$RUNNER_TEMP/ewctl-pages"
          if git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch gh-pages "https://github.com/${GITHUB_REPOSITORY}.git" "$SITE_REPO"
          else
            git init --initial-branch=gh-pages "$SITE_REPO"
            git -C "$SITE_REPO" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi
          cp .pio/site/index.html .pio/site/CNAME .pio/site/ersa-ewctl.db .pio/site/ersa-ewctl.files .pio/site/*.pkg.tar.zst "$SITE_REPO/"
          rm -rf "$SITE_REPO/wiki"
          mkdir -p "$SITE_REPO/wiki"
          cp -a .pio/wiki-site/. "$SITE_REPO/wiki/"
          if [[ "$GITHUB_REF" == refs/tags/ewp-* ]]; then
            mkdir -p "$SITE_REPO/firmware" "$SITE_REPO/ota"
            rm -f "$SITE_REPO/ota.json"
            find "$SITE_REPO/ota" -maxdepth 1 -type f -name 'ewp-*.json' -delete
            cp -a .pio/site/firmware/. "$SITE_REPO/firmware/"
            cp -a .pio/site/ota/. "$SITE_REPO/ota/"
          fi
          git -C "$SITE_REPO" add --all
          if git -C "$SITE_REPO" diff --cached --quiet; then
            echo "Package repository is already current."
            exit 0
          fi
          git -C "$SITE_REPO" commit -m "deploy: publish ewctl package repository ${GITHUB_REF_NAME}"
          git -C "$SITE_REPO" push origin gh-pages

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/ewp-')
    needs: [build, package-ewctl, publish-package-repository]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@v4

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: ewp-firmware-${{ github.sha }}
          path: .pio/release
      - name: Download ewctl Arch repository artifact
        uses: actions/download-artifact@v4
        with:
          name: ewctl-arch-repo-${{ github.sha }}
          path: .pio/release

      - name: Create release and attach firmware
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            .pio/release/firmware.bin
            .pio/release/ewp-factory.bin
            .pio/release/bootloader.bin
            .pio/release/partitions.bin
            .pio/release/boot_app0.bin
            .pio/release/SHA256SUMS
            .pio/release/FLASHING.md
            scripts/migrate_ota.sh
            .pio/release/ewctl-*.pkg.tar.zst
            .pio/release/ersa-ewctl.db
            .pio/release/ersa-ewctl.files
